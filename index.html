<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg-0:#101116;
    --bg-1:#15171d;
    --card:#1b1d24;
    --card-border:rgba(255,255,255,0.07);
    --text-hi:#f3f1ec;
    --text-lo:#8d909b;
    --divider:rgba(255,255,255,0.09);

    --personal:#e3a76f;
    --personal-soft:rgba(227,167,111,0.14);
    --professional:#6fa98c;
    --professional-soft:rgba(111,169,140,0.14);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
  }

  body{
    font-family:'Inter',sans-serif;
    color:var(--text-hi);
    background:
      radial-gradient(circle at 50% 0%, #1c1f27 0%, var(--bg-0) 55%),
      var(--bg-0);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:64px 20px 80px;
  }

  .page{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- profile ---------- */

  .profile{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:50px;
  }

  .avatar-ring{
    width:112px;
    height:112px;
    border-radius:50%;
    padding:3px;
    background:conic-gradient(from 210deg, var(--personal), #ffffff22, var(--professional), var(--personal));
    margin-bottom:22px;
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
  }

  .avatar{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    object-position:center top;
    display:block;
    border:1px solid rgba(255,255,255,0.06);
  }

  .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,6vw,32px);
    letter-spacing:0.2px;
    margin:0;
    text-align:center;
    color:var(--text-hi);
  }

  /* ---------- groups ---------- */

  .links-group{
    width:100%;
    margin-bottom:38px;
  }

  .links-group:last-child{
    margin-bottom:0;
  }

  .group-label{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    padding:0 2px;
  }

  .group-label span{
    font-size:12px;
    font-weight:600;
    letter-spacing:2.4px;
    text-transform:uppercase;
    color:var(--text-lo);
  }

  .group-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--divider);
  }

  .links-group.personal .group-label span{ color:var(--personal); }
  .links-group.professional .group-label span{ color:var(--professional); }

  .links-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  /* ---------- card ---------- */

  .link-card{
    --accent:var(--personal);
    --accent-soft:var(--personal-soft);

    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 18px;
    border-radius:16px;
    background:var(--card);
    border:1px solid var(--card-border);
    text-decoration:none;
    color:var(--text-hi);
    overflow:hidden;
    isolation:isolate;
    transition:transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }

  .links-group.professional .link-card{
    --accent:var(--professional);
    --accent-soft:var(--professional-soft);
  }

  .link-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--accent-soft);
    opacity:0;
    transition:opacity 0.18s ease;
    z-index:-1;
  }

  .link-card:hover{
    transform:translateY(-2px);
    border-color:color-mix(in srgb, var(--accent) 45%, var(--card-border));
  }

  .link-card:hover::before{
    opacity:1;
  }

  .link-card:active{
    transform:translateY(0) scale(0.98);
  }

  .link-card:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .icon{
    flex:0 0 auto;
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
  }

  .icon svg{
    width:100%;
    height:100%;
    display:block;
  }

  .platform-name{
    font-size:15.5px;
    font-weight:500;
    letter-spacing:0.1px;
  }

  .chevron{
    margin-left:auto;
    width:16px;
    height:16px;
    color:var(--text-lo);
    opacity:0.6;
    transition:transform 0.18s ease, opacity 0.18s ease;
    flex:0 0 auto;
  }

  .link-card:hover .chevron{
    transform:translateX(3px);
    opacity:1;
    color:var(--accent);
  }

  @media (prefers-reduced-motion: reduce){
    .link-card, .link-card::before, .chevron{
      transition:none;
    }
    .link-card:hover{
      transform:none;
    }
  }

  @media (max-width:340px){
    .avatar-ring{ width:96px; height:96px; }
    .avatar{ font-size:28px; }
  }
</style>
