<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohamed Akeel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg-0:#101116;
    --bg-1:#15171d;
    --card:#1b1d24;
    --card-border:rgba(255,255,255,0.07);
    --text-hi:#f3f1ec;
    --text-lo:#8d909b;
    --divider:rgba(255,255,255,0.09);

    --personal:#e3a76f;
    --personal-soft:rgba(227,167,111,0.14);
    --professional:#6fa98c;
    --professional-soft:rgba(111,169,140,0.14);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
  }

  body{
    font-family:'Inter',sans-serif;
    color:var(--text-hi);
    background:
      radial-gradient(circle at 50% 0%, #1c1f27 0%, var(--bg-0) 55%),
      var(--bg-0);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:64px 20px 80px;
  }

  .page{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- animations ---------- */

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @keyframes ringSpin{
    from{ --angle:210deg; }
    to{ --angle:570deg; }
  }

  @keyframes ringGlow{
    0%,100%{ box-shadow:0 8px 30px rgba(0,0,0,0.35), 0 0 0 0 rgba(227,167,111,0.0); }
    50%{ box-shadow:0 8px 34px rgba(0,0,0,0.4), 0 0 18px 2px rgba(227,167,111,0.22); }
  }

  @property --angle{
    syntax:'<angle>';
    initial-value:210deg;
    inherits:false;
  }

  .fade-in{
    opacity:0;
    animation:fadeUp 0.65s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  /* ---------- profile ---------- */

  .profile{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:48px;
  }

  .avatar-ring{
    width:120px;
    height:120px;
    border-radius:28px;
    padding:3px;
    background:conic-gradient(from var(--angle), var(--personal), #ffffff22, var(--professional), var(--personal));
    margin-bottom:22px;
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
    animation:ringSpin 7s linear infinite, ringGlow 3.2s ease-in-out infinite;
  }

  .avatar{
    width:100%;
    height:100%;
    border-radius:25px;
    object-fit:cover;
    object-position:center top;
    display:block;
    border:1px solid rgba(255,255,255,0.06);
  }

  .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,6vw,32px);
    letter-spacing:0.2px;
    margin:0;
    text-align:center;
    background:linear-gradient(100deg,
      var(--text-hi) 0%,
      var(--text-hi) 35%,
      var(--personal) 48%,
      var(--professional) 58%,
      var(--text-hi) 70%,
      var(--text-hi) 100%);
    background-size:250% 100%;
    background-position:0% 0;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:nameShine 3.5s linear infinite;
  }

  @keyframes nameShine{
    0%{ background-position:-150% 0; }
    100%{ background-position:150% 0; }
  }

  .tagline{
    margin:10px 0 0;
    font-size:14px;
    font-weight:500;
    letter-spacing:0.2px;
    text-align:center;
    background:linear-gradient(100deg,
      var(--text-lo) 0%,
      var(--text-lo) 30%,
      var(--personal) 45%,
      var(--professional) 55%,
      var(--text-lo) 70%,
      var(--text-lo) 100%);
    background-size:250% 100%;
    background-position:0% 0;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:nameShine 3.5s linear 0.4s infinite;
  }

  /* ---------- groups ---------- */

  .links-group{
    width:100%;
    margin-bottom:38px;
  }

  .links-group:last-child{
    margin-bottom:0;
  }

  .group-label{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    padding:0 2px;
  }

  .group-label span{
    font-size:12px;
    font-weight:600;
    letter-spacing:2.4px;
    text-transform:uppercase;
    background-size:250% 100%;
    background-position:-150% 0;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:nameShine 3.5s linear infinite;
  }

  .group-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--divider);
  }

  .links-group.personal .group-label span{
    font-weight:700;
    background-image:linear-gradient(100deg,
      var(--text-hi) 0%, var(--text-hi) 35%,
      var(--personal) 50%,
      var(--text-hi) 65%, var(--text-hi) 100%);
  }

  .links-group.professional .group-label span{
    font-weight:700;
    background-image:linear-gradient(100deg,
      var(--text-hi) 0%, var(--text-hi) 35%,
      var(--professional) 50%,
      var(--text-hi) 65%, var(--text-hi) 100%);
    animation-delay:0.3s;
  }

  .links-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  /* ---------- card ---------- */

  .link-card{
    --accent:var(--personal);
    --accent-soft:var(--personal-soft);

    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 18px;
    border-radius:16px;
    background:var(--card);
    border:1px solid var(--card-border);
    text-decoration:none;
    color:var(--text-hi);
    overflow:hidden;
    isolation:isolate;
    transition:transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }

  .links-group.professional .link-card{
    --accent:var(--professional);
    --accent-soft:var(--professional-soft);
  }

  .link-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--accent-soft);
    opacity:0;
    transition:opacity 0.18s ease;
    z-index:-1;
  }

  .link-card:hover{
    transform:translateY(-2px);
    border-color:color-mix(in srgb, var(--accent) 45%, var(--card-border));
  }

  .link-card:hover::before{
    opacity:1;
  }

  .link-card:active{
    transform:translateY(0) scale(0.98);
  }

  .link-card:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .icon{
    flex:0 0 auto;
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }

  .link-card:hover .icon{
    transform:scale(1.15) rotate(-6deg);
  }

  .link-card:active .icon{
    transform:scale(0.92);
  }

  .icon svg{
    width:100%;
    height:100%;
    display:block;
  }

  .platform-name{
    font-size:15.5px;
    font-weight:500;
    letter-spacing:0.1px;
  }

  .chevron{
    margin-left:auto;
    width:16px;
    height:16px;
    color:var(--text-lo);
    opacity:0.6;
    transition:transform 0.18s ease, opacity 0.18s ease;
    flex:0 0 auto;
  }

  .link-card:hover .chevron{
    transform:translateX(3px);
    opacity:1;
    color:var(--accent);
  }

  @media (prefers-reduced-motion: reduce){
    .link-card, .link-card::before, .chevron, .icon{
      transition:none;
    }
    .link-card:hover{
      transform:none;
    }
    .link-card:hover .icon{
      transform:none;
    }
    .avatar-ring{
      animation:none;
    }
    .name{
      animation:none;
      background-position:0 0;
    }
    .tagline{
      animation:none;
      background-position:0 0;
    }
    .group-label span{
      animation:none;
      background-position:0 0;
    }
    .fade-in{
      opacity:1;
      animation:none;
    }
  }

  @media (max-width:340px){
    .avatar-ring{ width:100px; height:100px; border-radius:24px; }
    .avatar{ border-radius:21px; }
  }
</style>
</head>
